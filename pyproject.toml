[project]
name = "usezend"
version = "0.1.0"
description = "Official Python client for the Zend messaging platform"
readme = "README.md"
license = "MIT"
authors = [{ name = "Zend" }]
requires-python = ">=3.10"
keywords = ["zend", "sms", "whatsapp", "voice", "email", "otp", "messaging", "sdk"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/usezend/zend-python"
Documentation = "https://tryzend.com/docs"
Repository = "https://github.com/usezend/zend-python"
Issues = "https://github.com/usezend/zend-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
